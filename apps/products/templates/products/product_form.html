{% extends "products/base.html" %}

{% block page_title %}iБАД | {{ title }}{% endblock page_title %}

{% block page_content %}
  <div class="form-card">
    <h1>{{ h1 }}</h1>
    
    <form method="POST" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
          {{ field }}
          {% if field.errors %}
            <div class="field-error">⚠️ {{ field.errors.0 }}</div>
          {% endif %}
        </div>
      {% endfor %}
      
      <button type="submit" class="btn-primary btn-full">{{ submit_button_text }}</button>
    </form>
  </div>
{% endblock page_content %}
