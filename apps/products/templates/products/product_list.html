          <div>
            <div class="product-price-btn">Цена: {{ product.price }} руб.</div>

            <button type="button"
                    class="btn-primary js-add-to-cart"
                    data-url="{% url 'cart:cart_add' product_id=product.id %}"
                    style="width: 100%; margin-top: 8px; padding: 8px;">
              🛒 Добавить в корзину
            </button>

            {% if user.is_authenticated %}
              <form action="{% url 'products:toggle_favorite' product_id=product.id %}" method="post" style="margin-top: 8px;">
                {% csrf_token %}
                {% if user in product.favorited_by.all %}
                  <button type="submit" class="btn-fav btn-fav-active" style="width: 100%;">
                    ❤️ В избранном ({{ product.favorited_by.count }})
                  </button>
                {% else %}
                  <button type="submit" class="btn-fav" style="width: 100%;">
                    🤍 В избранное ({{ product.favorited_by.count }})
                  </button>
                {% endif %}
              </form>
            {% endif %}
          </div>
