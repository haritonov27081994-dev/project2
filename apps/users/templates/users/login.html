{% extends 'products/base.html' %}

{% block page_title %}Вход в аккаунт — iБАД{% endblock page_title %}

{% block page_content %}
<div style="max-width: 450px; margin: 30px auto; padding: 25px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">
  <h1 style="color: #2e7d32; margin-top: 0;">Вход в аккаунт</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Войти</button>
  </form>
  <p style="margin-top: 15px; text-align: center;">
    Нет аккаунта? <a href="{% url 'users:register' %}" style="color: #2e7d32;">Зарегистрироваться</a>
  </p>
</div>
{% endblock page_content %}
